<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background circle with luxury rim -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Botanical Rose Emblem -->
  <g transform="translate(256, 210) scale(1.35)">
    <!-- Outer delicate petals -->
    <path d="M0 -60 C35 -60, 60 -35, 60 0 C60 35, 35 60, 0 60 C-35 60, -60 35, -60 0 C-60 -35, -35 -60, 0 -60" fill="url(#petalGrad)" opacity="0.25"/>
    <path d="M-15 -45 C25 -55, 55 -25, 45 15 C35 55, -25 55, -45 25 C-55 -15, -35 -40, -15 -45" fill="url(#petalGrad)" opacity="0.45"/>
    <!-- Rose spiral core -->
    <path d="M0 -30 C18 -30, 32 -16, 30 5 C28 24, 10 32, -8 28 C-24 24, -30 6, -24 -12 C-18 -26, -5 -30, 0 -30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M-2 -15 C8 -18, 16 -10, 15 2 C14 12, 4 16, -4 14 C-10 12, -12 4, -9 -4" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M-40 25 C-70 30, -85 60, -60 70 C-40 70, -35 45, -40 25" fill="#15803d" opacity="0.8"/>
    <path d="M40 25 C70 30, 85 60, 60 70 C40 70, 35 45, 40 25" fill="#15803d" opacity="0.8"/>
  </g>

  <!-- Brand Typography in SVG -->
  <text x="256" y="380" font-family="'Playfair Display', serif, Georgia" font-size="46" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="4">QUEVO</text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#fbcfe8" text-anchor="middle" letter-spacing="6">FLOWERS &amp; DECOR</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-style="italic" fill="#fce7f3" text-anchor="middle" opacity="0.85">Kigali · Rwanda</text>
</svg>
